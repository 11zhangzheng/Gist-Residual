extends: base.yaml
experiment_id: E05
required_fields: [production_authority, source.git_commit, inputs.states_manifest]
inputs:
  states_manifest: RESEARCH_OWNER_DECISION_REQUIRED
stability:
  state_count: 100
  repeats: 3
  maximum_flip_rate: 0.02
  temperature: 0.0
execution:
  command: [RESEARCH_OWNER_DECISION_REQUIRED_ANSWERER_STABILITY_COMMAND]
  may_generate_observations: false
outputs:
  required: [results/stability.json, results/raw_answers.jsonl]
