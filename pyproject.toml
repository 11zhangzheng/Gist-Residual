[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fidmem"
version = "0.1.0"
description = "Fidelity-graded long-video memory agent"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0,<2",
    "hydra-core>=1.3,<2",
    "imageio-ffmpeg>=0.6,<0.7",
    "omegaconf>=2.3,<3",
    "pydantic>=2.0,<3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
